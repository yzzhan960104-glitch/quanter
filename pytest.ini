[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
# 默认排除 slow 测试：discovery 端到端用例（test_cli_oos / test_plan*_e2e /
# test_cli_run / test_snapshot / test_worker / test_objective）通过 subprocess
# 真跑 freeze（读全 data_lake）+ scan_symbol，单测即耗时 3-4min，全跑会让日常
# 回归从秒级膨胀到 30min+。这里 -m "not slow" 与下方 marker 的设计意图一致
# （原作者 description 即 "deselect with '-m "not slow"'"）。
# ——手动验收 / 合并前必跑一次：`pytest -m slow`（命令行 -m 覆盖本 addopts）
# ——跑全部（含 slow）：`pytest -m ""` 或 `pytest -o addopts=""`
# e2e_long 同级 deselect（spec §11.3 + §13.10 红线）：默认排除避免 CI/日常回归
# 无意触发 23 日 full_run（~30-90min + 真推钉钉 + connect 5 bot 真起 + Tushare 限频）。
# 手动验收 full_run：`pytest -m e2e_long tests/e2e_long_cycle/`（命令行 -m 覆盖 addopts）
addopts = -v --tb=short -m "not slow and not e2e_long and not server_lifecycle"
markers =
    slow: marks tests as slow (deselect with '-m "not slow"', run with '-m slow')
    # C1-C7 长周期 E2E 时序回放（23 日 × 全 job）：
    # 单测即 ~30-90min（real pipeline + 8 时点 stoploss + 真推/真 connect），
    # CI 默认不跑（与 slow 同级 deselect）。手动验收 / 合并前必跑：
    #   pytest -m e2e_long tests/e2e_long_cycle/
    e2e_long: C1-C7 长周期 E2E 时序回放（23 日 × 全 job，~30-90min，CI 不默认跑）
    server_lifecycle: tests that boot the real HTTP server (deselect by default; run with -m server_lifecycle)
